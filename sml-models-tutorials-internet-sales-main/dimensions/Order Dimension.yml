unique_name: Order Dimension
object_type: dimension
label: Order Dimension
description: >-
  Sales order detail: transaction currency, sales order number, and order line
  item grain for internet sales transactions.
hierarchies:
  - unique_name: Order Dimension
    label: Order Dimension
    description: Order rollup Currency > Order (sales order number) > Order Line Item.
    folder: Orders
    levels:
      - unique_name: Currency
      - unique_name: Order
      - unique_name: Order Line Item
        secondary_attributes:
          - unique_name: Order Type
            label: Order Type
            description: >-
              Order line classification / category / type from the order master.
              Alternate grouping of order lines, independent of order number.
            dataset: dimorder
            folder: Orders
            key_columns:
              - type
            name_column: type
            sort_column: type
level_attributes:
  - unique_name: Currency
    label: Currency
    description: >-
      Transaction currency name of the sales order (e.g. US Dollar). Top of the
      Order Dimension hierarchy.
    dataset: dimorder
    key_columns:
      - currencykey
    name_column: currency_name
  - unique_name: Order
    label: Order
    description: >-
      Sales order number / order ID (e.g. SO43697). One order groups one or more
      line items; contrast Order Line Item (line grain).
    dataset: dimorder
    key_columns:
      - salesordernumber
      - currencykey
    name_column: salesordernumber
  - unique_name: Order Line Item
    label: Order Line Item
    description: Order Line Item
    dataset: dimorder
    is_unique_key: false
    key_columns:
      - salesorderlinenumber
      - salesordernumber
      - currencykey
    name_column: salesorderlinenumber
type: standard
